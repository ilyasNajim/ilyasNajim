<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="1" stop-color="#120a22"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#b57bff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a2440" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="8" y="8" width="984" height="324" rx="22"/></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .label { font-size: 13px; letter-spacing: 6px; fill: #00f5ff; }
    .name  { font-size: 78px; font-weight: 800; fill: url(#name); }
    .sub   { font-size: 13px; letter-spacing: 3px; fill: #7f8db3; }
    .open  { font-size: 13px; letter-spacing: 3px; fill: #b57bff; }
    .term  { font-size: 14px; fill: #cfe9ff; }
    .dim   { font-size: 12px; fill: #5b6a92; }
    .ok    { font-size: 14px; fill: #00f5ff; }
    .line  { opacity: 0; animation: show 10s infinite; }
    .l1 { animation-delay: .4s } .l2 { animation-delay: 1.2s }
    .l3 { animation-delay: 2s }  .l4 { animation-delay: 2.8s } .l5 { animation-delay: 3.6s }
    @keyframes show { 0% {opacity:0; transform: translateX(-8px)} 6% {opacity:1; transform: translateX(0)} 92% {opacity:1} 100% {opacity:0} }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .scanline { animation: sweep 6s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-80px) } 100% { transform: translateY(340px) } }
    .border { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { stroke-opacity: .35 } 50% { stroke-opacity: 1 } }
    .nameglow { animation: glowp 4s ease-in-out infinite; }
    @keyframes glowp { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
    .node { animation: np 3s ease-in-out infinite; }
    .n2 { animation-delay: .8s } .n3 { animation-delay: 1.6s } .n4 { animation-delay: 2.2s }
    @keyframes np { 0%,100% { opacity: .25; r: 3 } 50% { opacity: 1; r: 5 } }
    .bar { animation: grow 3s ease-in-out infinite; transform-origin: left center; }
    @keyframes grow { 0%,100% { transform: scaleX(.3) } 50% { transform: scaleX(1) } }
  </style>

  <g clip-path="url(#card)">
    <rect x="8" y="8" width="984" height="324" fill="url(#bg)"/>
    <rect x="8" y="8" width="984" height="324" fill="url(#grid)"/>
    <rect class="scanline" x="8" y="0" width="984" height="80" fill="url(#scan)"/>
    <!-- réseau de neurones décoratif -->
    <g stroke="#2a3a66" stroke-width="1" fill="none">
      <line x1="640" y1="40" x2="720" y2="28"/><line x1="720" y1="28" x2="820" y2="46"/>
      <line x1="820" y1="46" x2="930" y2="30"/><line x1="720" y1="28" x2="780" y2="60"/>
    </g>
    <circle class="node" cx="640" cy="40" r="3" fill="#00f5ff"/>
    <circle class="node n2" cx="720" cy="28" r="3" fill="#b57bff"/>
    <circle class="node n3" cx="820" cy="46" r="3" fill="#00f5ff"/>
    <circle class="node n4" cx="930" cy="30" r="3" fill="#b57bff"/>
  </g>
  <rect class="border" x="8" y="8" width="984" height="324" rx="22" fill="none" stroke="#00f5ff" stroke-width="1.5"/>

  <!-- Bloc gauche -->
  <line x1="50" y1="78" x2="84" y2="78" stroke="#00f5ff" stroke-width="2"/>
  <text class="label" x="96" y="83">AI / ML STUDENT</text>
  <g class="nameglow" filter="url(#glow)">
    <text class="name" x="46" y="160">ILYAS</text>
    <text class="name" x="46" y="238">NAJIM</text>
  </g>
  <line x1="50" y1="256" x2="330" y2="256" stroke="#00f5ff" stroke-opacity=".6" stroke-width="1.5"/>
  <text class="sub" x="50" y="282">EMSI · DUT IATE EST MEKNÈS</text>
  <text class="open" x="50" y="306">OPEN TO AI/ML INTERNSHIPS</text>

  <!-- Terminal -->
  <rect x="560" y="86" width="400" height="226" rx="12" fill="#0a0f1d" stroke="#00f5ff" stroke-opacity=".5"/>
  <line x1="560" y1="118" x2="960" y2="118" stroke="#1a2a50"/>
  <circle cx="582" cy="102" r="5" fill="#ff5f56"/>
  <circle cx="602" cy="102" r="5" fill="#ffbd2e"/>
  <circle cx="622" cy="102" r="5" fill="#27c93f"/>
  <text class="dim" x="650" y="106">~/stack</text>

  <text class="term line l1" x="584" y="152"><tspan fill="#00f5ff">$</tspan> python fastapi react php java</text>
  <text class="term line l2" x="584" y="180"><tspan fill="#00f5ff">$</tspan> nlp rag gemini llm</text>
  <text class="term line l3" x="584" y="208"><tspan fill="#00f5ff">$</tspan> tensorflow sklearn opencv</text>
  <text class="term line l4" x="584" y="236"><tspan fill="#00f5ff">$</tspan> mqtt mysql docker linux</text>
  <text class="ok line l5" x="584" y="274">ready.</text>
  <rect class="cursor" x="650" y="262" width="9" height="16" fill="#00f5ff"/>

  <!-- barre d'activité -->
  <rect x="584" y="292" width="140" height="3" rx="1.5" fill="#1a2a50"/>
  <rect class="bar" x="584" y="292" width="140" height="3" rx="1.5" fill="#00f5ff"/>
</svg>
