<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#1a0d33"/>
    </linearGradient>
    <linearGradient id="beat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#b57bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="998" height="228" rx="14"/></clipPath>
    <clipPath id="tick"><rect x="30" y="22" width="940" height="26"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .tick { font-size: 12px; letter-spacing: 5px; fill: #4a5a8a; }
    .ticker { animation: slide 28s linear infinite; }
    @keyframes slide { 0% { transform: translateX(0) } 100% { transform: translateX(-640px) } }
    .hb { stroke-dasharray: 260 1240; stroke-dashoffset: 260; animation: run 3.2s linear infinite; }
    @keyframes run { 0% { stroke-dashoffset: 260 } 100% { stroke-dashoffset: -1240 } }
    .base { stroke: #1d2b55; }
    .p { animation: float 7s ease-in-out infinite; }
    .p2 { animation-duration: 9s; animation-delay: 1s } .p3 { animation-duration: 6s; animation-delay: 2s }
    .p4 { animation-duration: 8s; animation-delay: 3s } .p5 { animation-duration: 10s; animation-delay: .5s }
    @keyframes float { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: .9 } 100% { transform: translateY(-120px); opacity: 0 } }
    .quote { font-size: 15px; letter-spacing: 2px; fill: #cfe9ff; }
    .quote2 { font-size: 12px; letter-spacing: 4px; fill: #b57bff; }
    .cur { animation: bl 1s steps(1) infinite; }
    @keyframes bl { 50% { opacity: 0 } }
  </style>
  <g clip-path="url(#card)">
    <rect x="1" y="1" width="998" height="228" fill="url(#bg)"/>
    <!-- particules -->
    <circle class="p" cx="140" cy="210" r="2.5" fill="#00f5ff"/>
    <circle class="p p2" cx="330" cy="215" r="2" fill="#b57bff"/>
    <circle class="p p3" cx="520" cy="212" r="3" fill="#00f5ff"/>
    <circle class="p p4" cx="710" cy="216" r="2" fill="#b57bff"/>
    <circle class="p p5" cx="870" cy="210" r="2.5" fill="#00f5ff"/>
    <!-- ticker -->
    <g clip-path="url(#tick)">
      <g class="ticker">
        <text class="tick" x="30" y="40">PYTHON · FASTAPI · REACT · TENSORFLOW · OPENCV · MQTT · MYSQL ·</text>
        <text class="tick" x="670" y="40">PYTHON · FASTAPI · REACT · TENSORFLOW · OPENCV · MQTT · MYSQL ·</text>
        <text class="tick" x="1310" y="40">PYTHON · FASTAPI · REACT · TENSORFLOW · OPENCV · MQTT · MYSQL ·</text>
      </g>
    </g>
    <line x1="30" y1="60" x2="970" y2="60" stroke="#1d2b55"/>
    <!-- message -->
    <text class="quote" x="500" y="100" text-anchor="middle">Always learning, building, and improving.</text>
    <text class="quote2" x="500" y="124" text-anchor="middle">SEE YOU IN THE NEXT COMMIT<tspan class="cur">_</tspan></text>
    <!-- battement de coeur -->
    <path class="base" fill="none" stroke-width="1.5" d="M30 170 H380 l14 -4 l10 4 H430 l12 -40 l16 76 l14 -58 l8 22 H560 l12 -4 l12 4 H970"/>
    <path class="hb" fill="none" stroke="url(#beat)" stroke-width="2.5" stroke-linecap="round" filter="url(#g)" d="M30 170 H380 l14 -4 l10 4 H430 l12 -40 l16 76 l14 -58 l8 22 H560 l12 -4 l12 4 H970"/>
  </g>
  <rect x="1" y="1" width="998" height="228" rx="14" fill="none" stroke="#1d2b55"/>
</svg>
