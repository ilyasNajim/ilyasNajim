<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/><stop offset="1" stop-color="#100a20"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="1" stop-color="#b57bff"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tick"><rect x="30" y="128" width="940" height="26"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .title { font-size: 13px; letter-spacing: 8px; fill: #00f5ff; }
    .lab { font-size: 12px; fill: #9db0e0; letter-spacing: 1px; }
    .tick { font-size: 12px; letter-spacing: 6px; fill: #3a4a7a; }
    .track { fill: #162040; }
    .fill { fill: url(#bar); animation: scan 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    .f2 { animation-delay: .6s } .f3 { animation-delay: 1.2s }
    @keyframes scan { 0%,100% { transform: scaleX(.25) } 50% { transform: scaleX(1) } }
    .ticker { animation: slide 22s linear infinite; }
    @keyframes slide { 0% { transform: translateX(0) } 100% { transform: translateX(-880px) } }
    .dot { animation: bl 1.6s ease-in-out infinite; }
    @keyframes bl { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  </style>
  <rect x="1" y="1" width="998" height="168" rx="14" fill="url(#bg)" stroke="#1d2b55"/>
  <circle class="dot" cx="426" cy="28" r="4" fill="#27c93f"/>
  <text class="title" x="444" y="33">SYSTEM STATUS</text>

  <!-- 3 axes de travail -->
  <text class="lab" x="60" y="72">document ai</text>
  <rect class="track" x="60" y="82" width="250" height="5" rx="2.5"/>
  <rect class="fill" x="60" y="82" width="250" height="5" rx="2.5" filter="url(#g)"/>

  <text class="lab" x="375" y="72">iot security</text>
  <rect class="track" x="375" y="82" width="250" height="5" rx="2.5"/>
  <rect class="fill f2" x="375" y="82" width="250" height="5" rx="2.5" filter="url(#g)"/>

  <text class="lab" x="690" y="72">computer vision</text>
  <rect class="track" x="690" y="82" width="250" height="5" rx="2.5"/>
  <rect class="fill f3" x="690" y="82" width="250" height="5" rx="2.5" filter="url(#g)"/>

  <!-- ticker -->
  <g clip-path="url(#tick)">
    <g class="ticker">
      <text class="tick" x="30" y="146">BUILDING · LEARNING · SHIPPING · BREAKING · FIXING · REPEATING ·</text>
      <text class="tick" x="910" y="146">BUILDING · LEARNING · SHIPPING · BREAKING · FIXING · REPEATING ·</text>
      <text class="tick" x="1790" y="146">BUILDING · LEARNING · SHIPPING · BREAKING · FIXING · REPEATING ·</text>
    </g>
  </g>
</svg>
