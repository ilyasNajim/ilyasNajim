<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="48" viewBox="0 0 1000 48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b57bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .streak { animation: run 4s ease-in-out infinite; }
    @keyframes run { 0% { transform: translateX(-200px); opacity: 0 } 15% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translateX(1000px); opacity: 0 } }
    .d { animation: dp 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: .4s } .d3 { animation-delay: .8s }
    @keyframes dp { 0%,100% { transform: scale(1) rotate(45deg); opacity: .7 } 50% { transform: scale(1.5) rotate(45deg); opacity: 1 } }
  </style>
  <rect width="1000" height="48" fill="#0a0e1a" rx="6"/>
  <!-- graduations -->
  <g stroke="#26355f" stroke-width="1">
    <line x1="100" y1="21" x2="100" y2="27"/><line x1="170" y1="19" x2="170" y2="29"/><line x1="240" y1="21" x2="240" y2="27"/>
    <line x1="760" y1="21" x2="760" y2="27"/><line x1="830" y1="19" x2="830" y2="29"/><line x1="900" y1="21" x2="900" y2="27"/>
  </g>
  <line x1="0" y1="24" x2="1000" y2="24" stroke="url(#fade)" stroke-width="1.5"/>
  <rect class="streak" x="0" y="22.5" width="200" height="3" fill="url(#streak)" opacity="0.9" filter="url(#g)"/>
  <g filter="url(#g)">
    <rect class="d d2" x="456" y="20" width="8" height="8" fill="#00f5ff"/>
    <rect class="d" x="496" y="18" width="12" height="12" fill="#b57bff"/>
    <rect class="d d3" x="540" y="20" width="8" height="8" fill="#00f5ff"/>
  </g>
</svg>
